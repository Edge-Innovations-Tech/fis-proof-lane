apiVersion: apps/v1
kind: Deployment
metadata:
  name: fis-lane
  labels:
    app.kubernetes.io/name: fis-lane
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: fis-lane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fis-lane
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:fis-bad-tag-2
        resources:
          requests: { cpu: 5m, memory: 8Mi }
          limits: { cpu: 20m, memory: 16Mi }
